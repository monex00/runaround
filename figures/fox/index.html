<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* A fox for runaround: drawn on a transparent page, rendered as RGBA
         frames; runaround's masks.py reads its silhouette from the alpha. */
      :root {
        --fur: #e2672a;
        --fur-shade: #b9481d;
        --fur-far: #c5531f;
        --cream: #fbf3e4;
        --ink: #2a1a12;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #stage path,
      #stage ellipse,
      #stage circle {
        stroke: var(--ink);
        stroke-width: 7;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      #stage .flat {
        stroke: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <svg
        id="stage"
        class="clip"
        data-start="0"
        data-duration="6"
        data-track-index="0"
        viewBox="0 0 1080 1920"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <!-- hand-drawn line boil: the noise seed changes 12 times a second -->
          <filter id="boil" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence id="boil-noise" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>

        <!-- fox, facing right; local origin on the ground under the body -->
        <g id="fox" filter="url(#boil)">
          <g id="squash">
            <g id="body-rig">
              <!-- far legs, behind everything -->
              <g id="leg-fb" transform="translate(-80,-120)">
                <path d="M -14,0 L 14,0 L 10,95 L 13,118 L -6,120 L -10,95 Z" fill="var(--fur-shade)" />
                <path class="flat" d="M -9,82 L 10,82 L 12,116 L -5,118 Z" fill="var(--ink)" />
              </g>
              <g id="leg-ff" transform="translate(110,-120)">
                <path d="M -13,0 L 13,0 L 9,95 L 12,118 L -6,120 L -9,95 Z" fill="var(--fur-shade)" />
                <path class="flat" d="M -8,82 L 9,82 L 11,116 L -5,118 Z" fill="var(--ink)" />
              </g>

              <!-- tail -->
              <g id="tail" transform="translate(-135,-165)">
                <path
                  d="M 18,22 C -30,-6 -95,-4 -152,-58 C -205,-104 -218,-168 -178,-180 C -142,-190 -122,-146 -96,-112 C -62,-72 -22,-44 26,-26 Z"
                  fill="var(--fur)"
                />
                <path
                  d="M -168,-92 C -202,-120 -214,-162 -180,-177 C -152,-186 -134,-162 -126,-138 C -140,-124 -155,-108 -168,-92 Z"
                  fill="var(--cream)"
                />
              </g>

              <!-- body -->
              <path
                id="body"
                d="M -148,-150 C -152,-232 122,-246 160,-170 C 178,-98 -116,-78 -148,-150 Z"
                fill="var(--fur)"
              />
              <path
                class="flat"
                d="M -128,-122 C -60,-96 82,-104 146,-140 C 128,-110 40,-94 -60,-97 C -92,-100 -114,-108 -128,-122 Z"
                fill="var(--fur-shade)"
              />
              <path
                class="flat"
                d="M 70,-112 C 100,-118 128,-135 148,-160 C 152,-130 130,-110 96,-104 Z"
                fill="var(--cream)"
              />

              <!-- near legs, in front of the body -->
              <g id="leg-nb" transform="translate(-100,-118)">
                <path d="M -15,0 L 15,0 L 11,95 L 14,120 L -6,122 L -11,95 Z" fill="var(--fur)" />
                <path class="flat" d="M -10,84 L 11,84 L 13,118 L -5,120 Z" fill="var(--ink)" />
              </g>
              <g id="leg-nf" transform="translate(95,-118)">
                <path d="M -14,0 L 14,0 L 10,95 L 13,120 L -6,122 L -10,95 Z" fill="var(--fur)" />
                <path class="flat" d="M -9,84 L 10,84 L 12,118 L -5,120 Z" fill="var(--ink)" />
              </g>

              <!-- head, pivot at the neck -->
              <g id="head" transform="translate(120,-195)">
                <g id="ear-far">
                  <path d="M -2,-42 L 4,-112 L 36,-52 Z" fill="var(--fur-shade)" />
                </g>
                <path
                  d="M -32,-8 C -28,-62 34,-72 56,-42 L 122,-2 C 96,22 32,32 -8,27 C -36,22 -42,6 -32,-8 Z"
                  fill="var(--fur)"
                />
                <path
                  class="flat"
                  d="M 14,20 C 56,22 96,10 118,0 C 92,24 40,32 6,27 Z"
                  fill="var(--cream)"
                />
                <g id="ear-near">
                  <path d="M 14,-48 L 40,-120 L 60,-44 Z" fill="var(--fur)" />
                  <path class="flat" d="M 26,-54 L 40,-102 L 50,-52 Z" fill="var(--ink)" />
                </g>
                <circle cx="120" cy="-3" r="10" fill="var(--ink)" />
                <ellipse id="eye" cx="48" cy="-24" rx="6" ry="9" fill="var(--ink)" class="flat" />
              </g>
            </g>
          </g>
        </g>
      </svg>
    </div>
    <script>
      // Everything is a function of t (seconds); no state carried between frames.
      const GROUND = 1260; // y of the fox's feet on the page
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const smooth = (s) => s * s * (3 - 2 * s);
      const mix = (a, b, s) => a + (b - a) * s;
      const deg = (r) => (r * 180) / Math.PI;

      // where the fox is along the page
      function xAt(t) {
        if (t < 1.6) return -260 + 380 * t; // trot in
        if (t < 2.0) { const u = t - 1.6; return 348 + 380 * u - 475 * u * u; } // brake
        if (t < 4.2) return 424;
        if (t < 4.9) return mix(424, 760, smooth(seg(t, 4.2, 4.9))); // the leap
        if (t < 5.1) return 760;
        const u = t - 5.1; return 760 + 380 * u + 430 * u * u; // bolt away
      }
      const speedAt = (t) => (xAt(t + 0.01) - xAt(t - 0.01)) / 0.02;

      function renderAt(t) {
        const x = xAt(t);
        const speed = Math.abs(speedAt(t));
        const walking = clamp(speed / 300); // legs swing only while moving
        const leaping = t > 4.2 && t < 4.9 ? Math.sin(Math.PI * seg(t, 4.2, 4.9)) : 0;

        // trot: diagonal pairs swing together, phase tied to distance (no foot slide)
        const phi = (2 * Math.PI * x) / 150;
        const swing = 30 * walking * (1 - leaping);
        let nf = swing * Math.sin(phi), ff = swing * Math.sin(phi + Math.PI);
        let nb = swing * Math.sin(phi + Math.PI), fb = swing * Math.sin(phi);
        // in the air: front legs reach forward, back legs push back
        nf -= 55 * leaping; ff -= 45 * leaping; nb += 55 * leaping; fb += 45 * leaping;
        const bob = -7 * walking * Math.abs(Math.cos(phi));

        // crouch before the leap, squash on landing
        const crouch = smooth(seg(t, 3.8, 4.15)) * (1 - seg(t, 4.15, 4.25));
        const land = t > 4.9 && t < 5.25 ? Math.sin(Math.PI * seg(t, 4.9, 5.25)) : 0;
        const sy = 1 - 0.14 * crouch - 0.12 * land + 0.08 * leaping;
        const sx = 1 + 0.08 * crouch + 0.08 * land - 0.04 * leaping;
        const lift = -280 * leaping;
        const pitch = -12 * Math.sin(Math.PI * clamp(seg(t, 4.2, 4.9) * 2)) * (t < 4.55 ? 1 : 0)
          + 14 * Math.sin(Math.PI * clamp((seg(t, 4.2, 4.9) - 0.5) * 2)) * (t >= 4.55 ? 1 : 0)
          + 4 * crouch;

        // sniff: head down to the ground, nose bobbing; then up, ears perked
        const sniff = smooth(seg(t, 2.2, 2.6)) * (1 - smooth(seg(t, 3.3, 3.6)));
        const nose = sniff * 6 * Math.sin(t * 28);
        const look = smooth(seg(t, 3.4, 3.7)) * (1 - smooth(seg(t, 3.9, 4.1)));
        const headRot = 38 * sniff + nose - 10 * look - 8 * leaping + 3 * walking * Math.sin(phi * 2);
        const headDrop = 40 * sniff;
        const ear = 1 + 0.18 * look;
        const blink = Math.abs(t - 3.75) < 0.05 ? 0.15 : 1;

        // tail: slow sway, trailing the vertical motion
        const tail = 10 * Math.sin(t * 2.6) + 22 * leaping - 14 * land + 8 * walking * Math.sin(phi);

        document.getElementById("fox").setAttribute(
          "transform",
          `translate(${x.toFixed(2)},${(GROUND + lift + bob).toFixed(2)})`
        );
        document.getElementById("squash").setAttribute("transform", `scale(${sx.toFixed(4)},${sy.toFixed(4)})`);
        document.getElementById("body-rig").setAttribute("transform", `rotate(${pitch.toFixed(2)},0,-150)`);
        const leg = (id, x0, y0, a) =>
          document.getElementById(id).setAttribute("transform", `translate(${x0},${y0}) rotate(${a.toFixed(2)})`);
        leg("leg-nf", 95, -118, nf);
        leg("leg-ff", 110, -120, ff);
        leg("leg-nb", -100, -118, nb);
        leg("leg-fb", -80, -120, fb);
        document.getElementById("tail").setAttribute("transform", `translate(-135,-165) rotate(${tail.toFixed(2)})`);
        document.getElementById("head").setAttribute(
          "transform",
          `translate(120,${(-195 + headDrop).toFixed(2)}) rotate(${headRot.toFixed(2)})`
        );
        document.getElementById("ear-near").setAttribute("transform", `translate(40,-48) scale(1,${ear.toFixed(3)}) translate(-40,48)`);
        document.getElementById("ear-far").setAttribute("transform", `translate(18,-48) scale(1,${ear.toFixed(3)}) translate(-18,48)`);
        document.getElementById("eye").setAttribute("transform", `translate(48,-24) scale(1,${blink}) translate(-48,24)`);
        document.getElementById("boil-noise").setAttribute("seed", String(1 + Math.floor(t * 12)));
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);

      // the film's clock: an empty paused timeline as long as the film
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 6 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
